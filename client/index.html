  <!-- Google tag (gtag.js) - loaded on first interaction or delayed timeout to preserve TBT and main thread -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-PKP9YKF18K');

    (function() {
      var loaded = false;
      function loadGtag() {
        if (loaded) return;
        loaded = true;
        ['scroll', 'touchstart', 'pointerdown', 'keydown'].forEach(function(e) {
          window.removeEventListener(e, loadGtag);
        });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PKP9YKF18K';
        document.head.appendChild(s);
      }
      ['scroll', 'touchstart', 'pointerdown', 'keydown'].forEach(function(e) {
        window.addEventListener(e, loadGtag, { once: true, passive: true });
      });
      setTimeout(loadGtag, 8000);
    })();
  </script>

  <!-- Theme Detection (Prevents theme flash on initial render) -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('vite-ui-theme');
        var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
