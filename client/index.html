<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Resource Hints -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

  <!-- Google tag (gtag.js) - queue initialized immediately, script loaded on idle to protect FCP/LCP -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-PKP9YKF18K');

    (function() {
      function loadGtag() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PKP9YKF18K';
        document.head.appendChild(s);
      }
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(loadGtag);
      } else {
        window.addEventListener('load', loadGtag);
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VelocityAI – AI-Powered Learning Platform</title>
  <meta name="description"
    content="Transform your study notes into AI-powered summaries and quizzes. VelocityAI helps students learn smarter with affordable AI-driven study tools.">

  <!-- Theme Detection (Prevents theme flash on initial render) -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('vite-ui-theme');
        var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Canonical -->
  <link rel="canonical" href="https://velocityaisoftware.app/" />

  <!-- Verification Tags -->
  <meta name="msvalidate.01" content="126AE45CBFE9238E899DF070A7FF30E4" />

  <!-- Open Graph (static fallback for social scrapers & search engines) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VelocityAI" />
  <meta property="og:title" content="VelocityAI – AI-Powered Learning Platform" />

    content="Transform your study notes into AI-powered summaries and quizzes. Study smarter, not harder." />

    content="Transform your study notes into AI-powered summaries and quizzes. Study smarter, not harder." />
  <meta name="twitter:image" content="https://velocityaisoftware.app/pwa-512x512.png" />

  <!-- Google Search & Browser Favicons (multiples of 48px square + SVG + ICO) -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- Critical Inline CSS (Instant Paint & Zero CLS) -->
  <style>
    :root {
      --background: 223 11% 97%;
      --foreground: 219 100% 10%;
      --card: 0 0% 100%;
      --primary: 210 96% 40%;
      --primary-foreground: 210 40% 98%;
      --muted-foreground: 220 15% 43%;
      --border: 222 11% 85%;
      --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .dark {
      --background: 224 71% 4%;
      --foreground: 210 40% 98%;
      --card: 223 51% 11%;
      --primary: 221.2 83.2% 53.3%;
      --primary-foreground: 210 40% 98%;
      --muted-foreground: 215.4 16.3% 65%;
      --border: 217.2 32.6% 17.5%;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-family: var(--font-sans); }
    body {
      margin: 0;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .hero-prerender-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 4rem; display: flex; align-items: center;
      background-color: hsl(var(--background) / 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid hsl(var(--border));
    }
    .hero-prerender-nav-inner {
      max-width: 80rem; width: 100%; margin: 0 auto;
      padding: 0 1rem; display: flex; justify-content: space-between; align-items: center;
    }
    .hero-prerender-logo {
      font-weight: 700; font-size: 1.25rem; color: hsl(var(--foreground)); text-decoration: none;
    }
    .hero-prerender-section {
      position: relative; min-height: 100vh; display: flex; align-items: center;
      overflow: hidden; padding-top: 4rem;
    }
    .hero-prerender-container {
      max-width: 80rem; width: 100%; margin: 0 auto;
      padding: 5rem 1rem; position: relative; z-index: 10;
    }
    .hero-prerender-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 1rem; border-radius: 9999px;
      background-color: hsl(var(--primary) / 0.1);
      color: hsl(var(--primary));
      font-size: 0.875rem; font-weight: 500; margin-bottom: 2rem;
    }
    .hero-prerender-h1 {
      font-size: clamp(2.5rem, 5vw, 3.75rem);
      font-weight: 700; line-height: 1.15;
      letter-spacing: -0.025em; margin: 0 0 1.5rem 0;
      color: hsl(var(--foreground));
    }
    .hero-prerender-desc {
      font-size: 1.25rem; line-height: 1.75;
      color: hsl(var(--muted-foreground));
      max-width: 42rem; margin: 0 0 2rem 0;
    }
    .hero-prerender-cta {
      display: flex; flex-wrap: wrap; gap: 1rem;
    }
    .hero-prerender-btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 0.5rem;
      background-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      font-weight: 500; font-size: 1rem; text-decoration: none;
    }
    .hero-prerender-btn-outline {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.75rem 1.5rem; border-radius: 0.5rem;
      border: 1px solid hsl(var(--border));
      background-color: transparent;
      color: hsl(var(--foreground));
      font-weight: 500; font-size: 1rem; text-decoration: none;
    }
  </style>
</head>

<body>
  <!-- Pre-rendered Semantic Skeleton for Instant LCP (<500ms) & Zero CLS -->
  <div id="root">
    <div style="min-height: 100vh;">
      <nav class="hero-prerender-nav">
        <div class="hero-prerender-nav-inner">
          <a href="/" class="hero-prerender-logo">Velocity AI</a>
          <a href="/auth" class="hero-prerender-btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Get Started</a>
        </div>
      </nav>
      <section class="hero-prerender-section">
        <div class="hero-prerender-container">
          <div style="max-width: 42rem;">
            <div class="hero-prerender-badge">
              <span>✨ Velocity AI — AI-Powered Learning</span>
            </div>
            <h1 class="hero-prerender-h1">
              Velocity AI: Your Exam-Focused Study Engine
            </h1>
            <p class="hero-prerender-desc">
              Transform your notes into AI-powered summaries and quizzes. Learn faster and retain more with our affordable AI study assistant.
            </p>
            <div class="hero-prerender-cta">
              <a href="/auth" class="hero-prerender-btn-primary">
                Get Started Free &rarr;
              </a>
              <a href="#how-it-works" class="hero-prerender-btn-outline">
                How It Works
              </a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
